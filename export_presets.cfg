html/head_include="<script src=\"https://sdk.crazygames.com/crazygames-sdk-v3.js\"></script>\n<style>body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;background:#121a2e;}</style>\n<script>\n// Small bridge between the Godot game and the CrazyGames SDK v3.\n// Every call is safe when the SDK is missing or disabled.\nwindow.CGBridge = (function () {\n  var b = { env: \"none\", ready: false, wantGameplay: false, loaded: false };\n  function sdk() { return window.CrazyGames && window.CrazyGames.SDK; }\n  b.ok = function () { return b.ready && b.env !== \"disabled\"; };\n  b.call = function (fn) {\n    if (!b.ok()) return;\n    try { fn(sdk()); } catch (e) { console.warn(\"CrazyGames SDK:\", e); }\n  };\n  b.loadingStop = function () { b.loaded = true; b.call(function (s) { s.game.loadingStop(); }); };\n  b.gameplayStart = function () { b.wantGameplay = true; b.call(function (s) { s.game.gameplayStart(); }); };\n  b.gameplayStop = function () { b.wantGameplay = false; b.call(function (s) { s.game.gameplayStop(); }); };\n  b.happytime = function () { b.call(function (s) { s.game.happytime(); }); };\n  b.requestAd = function (type, cb) {\n    var done = false;\n    function finish(result) { if (done) return; done = true; cb(result); }\n    if (!b.ok()) { finish(\"unavailable\"); return; }\n    try {\n      sdk().ad.requestAd(type, {\n        adStarted: function () {},\n        adFinished: function () { finish(\"finished\"); },\n        adError: function (e) { console.warn(\"CrazyGames ad:\", e); finish(\"error\"); }\n      });\n    } catch (e) { finish(\"error\"); }\n  };\n  function init() {\n    if (!sdk()) return;\n    sdk().init().then(function () {\n      b.env = sdk().environment;\n      b.ready = true;\n      if (b.loaded) b.call(function (s) { s.game.loadingStop(); });\n      else b.call(function (s) { s.game.loadingStart(); });\n      if (b.wantGameplay) b.call(function (s) { s.game.gameplayStart(); });\n    }).catch(function (e) { console.warn(\"CrazyGames SDK init failed:\", e); });\n  }\n  // The SDK adds elements to <body>, so wait for it to exist.\n  if (document.body) init(); else document.addEventListener(\"DOMContentLoaded\", init);\n  // Stop the page from scrolling on game keys.\n  window.addEventListener(\"keydown\", function (e) {\n    if ([\" \", \"ArrowUp\", \"ArrowDown\", \"ArrowLeft\", \"ArrowRight\", \"Tab\"].indexOf(e.key) >= 0) e.preventDefault();\n  }, { passive: false });\n  return b;\n})();\n</script>"
